name: Bug report
description: Report a reproducible problem with the .NET projection.
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here; follow [SECURITY.md](https://github.com/microsoft/XBOX-GDK-dotnet/blob/main/SECURITY.md).
        Use sanitized examples and diagnostics. Do not include account identifiers, tokens, private feed URLs, or private title/sandbox configuration.
  - type: input
    id: version
    attributes:
      label: GDK.Net version or source commit
      description: Include the exact package version, release tag, or commit SHA.
    validations:
      required: true
  - type: input
    id: gdk
    attributes:
      label: GDK edition and resolved package versions
      description: Include the installed edition, or the exact Microsoft.GDK.Windows and Microsoft.GDK.Core versions if using NuGet.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: .NET SDK/runtime, target framework, Windows version, architecture/RID, host or engine, and JIT or NativeAOT. Say whether this is a packaged or unpackaged app.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal public code and exact steps or commands. State whether the problem occurs during restore, build, publish, or execution.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized exception messages, numeric HRESULTs, and relevant logs.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation performed
      description: List commands and results, including whether you performed manual live validation. Do not include title, account, or sandbox identifiers.
