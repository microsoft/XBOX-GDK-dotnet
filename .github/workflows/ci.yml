name: CI

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
      aot: ${{ steps.scope.outputs.aot }}
      docs: ${{ steps.scope.outputs.docs }}
      automation: ${{ steps.scope.outputs.automation }}
      evidence_base: ${{ steps.scope.outputs.evidence_base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: scope
        run: node eng/ci/pr_gates.cjs scope

  lint:
    name: CI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test scope and aggregate contracts
        run: node --test eng/ci/pr_gates.test.cjs
      - name: Lint handwritten workflows
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          find .github/workflows -maxdepth 1 -name '*.yml' ! -name '*.lock.yml' -print0 |
            xargs -0 "$(go env GOPATH)/bin/actionlint" -color
      - name: Parse PowerShell scripts without executing them
        shell: pwsh
        run: |
          $files = git ls-files -- '*.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate PowerShell scripts.' }
          $failures = @()
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $file), [ref]$tokens, [ref]$parseErrors)
            foreach ($errorRecord in $parseErrors) {
              $failures += "$file`:$($errorRecord.Extent.StartLineNumber): $($errorRecord.Message)"
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }

  build:
    name: Build and package
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare, build, test and pack the checked-out GDK pin
        shell: pwsh
        env:
          CHECK_AOT: ${{ needs.scope.outputs.aot }}
          CHECK_DOCS: ${{ needs.scope.outputs.docs }}
          EVIDENCE_BASE: ${{ needs.scope.outputs.evidence_base }}
          GDK_MANUAL_EVIDENCE: ${{ vars.GDK_MANUAL_EVIDENCE }}
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          if (Test-Path (Join-Path $installer 'vswhere.exe')) { $env:PATH = "$installer;$env:PATH" }
          $options = @{ Configuration = 'Release'; Test = $true; Pack = $true }
          if ($env:CHECK_AOT -eq 'true') { $options.Aot = $true }
          if ($env:CHECK_DOCS -eq 'true') { $options.CheckDocs = $true }
          if ($env:EVIDENCE_BASE) { $options.BaseCommit = $env:EVIDENCE_BASE }
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $options.ReleaseEvidence = $true }
          $evidencePath = $null
          try {
            if ($env:GDK_MANUAL_EVIDENCE -and ($options.BaseCommit -or $options.ReleaseEvidence)) {
              $evidencePath = Join-Path $env:RUNNER_TEMP 'gdk-manual-attestation.json'
              [IO.File]::WriteAllText($evidencePath, $env:GDK_MANUAL_EVIDENCE, [Text.UTF8Encoding]::new($false))
              $options.ManualEvidencePath = $evidencePath
            }
            & .\eng\build.ps1 @options
            if ($LASTEXITCODE -ne 0) { throw "Build verification failed: $LASTEXITCODE" }
          } finally {
            if ($evidencePath -and (Test-Path -LiteralPath $evidencePath)) {
              Remove-Item -LiteralPath $evidencePath -Force
            }
          }
          "Build, tests and package checks passed. NativeAOT selected: $env:CHECK_AOT. API docs selected: $env:CHECK_DOCS." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Retain packages and sanitized provenance
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gdk-net-${{ github.sha }}
          path: |
            artifacts/gdk/**/GDK.Net.*.nupkg
            artifacts/gdk/**/provenance.json
          if-no-files-found: error
          retention-days: 30

  aot:
    name: NativeAOT
    needs: [scope, build]
    if: needs.scope.outputs.aot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "NativeAOT compilation passed in the shared build job; no live harness was executed."

  docs:
    name: API docs
    needs: [scope, build]
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Full non-mutating API reference comparison passed in the shared build job."

  automation:
    name: Automation checks
    needs: scope
    if: needs.scope.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test automation helpers
        working-directory: eng/ci
        run: node --test
      - name: Validate synthetic evaluation fixtures
        run: node eng/ci/issue_triage_eval.cjs validate-fixtures --no-fetch
      - name: Verify pinned agentic-workflow compilation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh extension install github/gh-aw --pin v0.89.21
          gh aw version | grep -F 'v0.89.21'
          gh aw compile issue-triage issue-triage-eval gdk-release-assess \
            --strict --no-check-update --schedule-seed microsoft/XBOX-GDK-dotnet
          git diff --exit-code -- .github/workflows '*.lock.yml' .github/aw/actions-lock.json

  gates:
    name: PR gates
    if: always()
    needs: [scope, lint, build, aot, docs, automation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require all selected lanes and static checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node eng/ci/pr_gates.cjs aggregate
